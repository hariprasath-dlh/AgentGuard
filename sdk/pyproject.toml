[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-sdk"
dynamic = ["version"]
description = "Developer SDK for AgentGuard runtime governance layer"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "AgentGuard Team" }
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.dynamic]
version = { attr = "agentguard.__version__" }

