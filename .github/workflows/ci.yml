name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR / branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. Backend lint (ruff)
  # ──────────────────────────────────────────────────────────────────
  lint-backend:
    name: Lint - Backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check backend/app backend/tests --config backend/ruff.toml
        # Ruff exits non-zero on any lint violation, blocking the PR

  # ──────────────────────────────────────────────────────────────────
  # 2. Frontend typecheck (tsc --noEmit)
  # ──────────────────────────────────────────────────────────────────
  typecheck-frontend:
    name: Typecheck - Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript typecheck
        run: npx tsc --noEmit
        working-directory: frontend

  # ──────────────────────────────────────────────────────────────────
  # 3. Backend test suite - real Postgres + Redis service containers
  #    NOTE: SQLite is explicitly NOT used here. The project has a known
  #    history of tests passing on SQLite but failing on Postgres due to
  #    dialect differences in concurrency and locking behavior.
  # ──────────────────────────────────────────────────────────────────
  test-backend:
    name: Tests - Backend (Postgres + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agentguard
          POSTGRES_PASSWORD: agentguard_password
          POSTGRES_DB: agentguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://agentguard:agentguard_password@localhost:5432/agentguard_test
      DATABASE_URL: postgresql://agentguard:agentguard_password@localhost:5432/agentguard_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-jwt-secret-not-used-in-prod
      GOOGLE_CLIENT_ID: mock-google-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: mock-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback
      FRONTEND_URL: http://localhost:8080
      API_BASE_URL: http://localhost:8000
      AGENTGUARD_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies + coverage tools
        run: pip install -r requirements.txt ruff pytest-cov
        working-directory: backend

      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: backend

      - name: Run UNIT tests with coverage (threshold >= 80%)
        run: |
          PYTHONPATH=. pytest tests/ -m unit \
            --cov=app \
            --cov-report=json:coverage-unit.json \
            --cov-report=term-missing \
            -v
        working-directory: backend

      - name: Enforce UNIT coverage gate (>= 80%)
        run: |
          python - <<'PYEOF'
          import json, sys

          with open("coverage-unit.json") as f:
              data = json.load(f)

          total = data["totals"]["percent_covered"]
          print(f"Unit test coverage: {total:.1f}%")

          if total < 80:
              print(f"FAIL: Unit coverage {total:.1f}% is below the required 80% threshold.")
              sys.exit(1)

          print(f"PASS: Unit coverage gate ({total:.1f}% >= 80%)")
          PYEOF
        working-directory: backend

      - name: Run INTEGRATION tests with coverage (threshold >= 60%)
        run: |
          PYTHONPATH=. pytest tests/ -m integration \
            --cov=app \
            --cov-report=json:coverage-integration.json \
            --cov-report=term-missing \
            -v
        working-directory: backend

      - name: Enforce INTEGRATION coverage gate (>= 60%)
        run: |
          python - <<'PYEOF'
          import json, sys

          with open("coverage-integration.json") as f:
              data = json.load(f)

          total = data["totals"]["percent_covered"]
          print(f"Integration test coverage: {total:.1f}%")

          if total < 60:
              print(f"FAIL: Integration coverage {total:.1f}% is below the required 60% threshold.")
              sys.exit(1)

          print(f"PASS: Integration coverage gate ({total:.1f}% >= 60%)")
          PYEOF
        working-directory: backend

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage-unit.json
            backend/coverage-integration.json

  # ──────────────────────────────────────────────────────────────────
  # 4. SDK test suite - same real Postgres + Redis
  # ──────────────────────────────────────────────────────────────────
  test-sdk:
    name: Tests - SDK (Postgres + Redis)
    runs-on: ubuntu-latest
    needs: test-backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agentguard
          POSTGRES_PASSWORD: agentguard_password
          POSTGRES_DB: agentguard_sdk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://agentguard:agentguard_password@localhost:5432/agentguard_sdk_test
      DATABASE_URL: postgresql://agentguard:agentguard_password@localhost:5432/agentguard_sdk_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-jwt-secret-not-used-in-prod
      GOOGLE_CLIENT_ID: mock-google-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: mock-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback
      FRONTEND_URL: http://localhost:8080
      API_BASE_URL: http://localhost:8000
      AGENTGUARD_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies (SDK tests import app.* internals)
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install SDK in editable mode
        run: pip install -e .
        working-directory: sdk

      - name: Install SDK test runner dependencies
        run: pip install pytest httpx uvicorn

      - name: Run Alembic migrations
        run: alembic upgrade head
        working-directory: backend

      - name: Run SDK tests
        run: |
          PYTHONPATH=../backend pytest tests/ -v
        working-directory: sdk

  # ──────────────────────────────────────────────────────────────────
  # 5. Frontend build
  # ──────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build - Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000

  # ──────────────────────────────────────────────────────────────────
  # 6. Backend Docker image build
  # ──────────────────────────────────────────────────────────────────
  build-backend-docker:
    name: Build - Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: agentguard-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────
  # 7. Secrets scanning (gitleaks)
  #    Runs automatically on every push, so manual scans are no longer
  #    required as a pre-deploy checklist item.
  # ──────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
